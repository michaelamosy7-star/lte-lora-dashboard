<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT Spectrum Analyzer - Operator Access</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <!-- QR Code Generator Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <style>
    :root {
      --bg-color: #0A0D12;
      --card-bg: #121820;
      --border-color: #1E293B;
      --accent-green: #00E676;
      --accent-blue: #00B0FF;
      --text-main: #F1F5F9;
      --text-muted: #94A3B8;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 230, 118, 0.08) 0%, transparent 70%),
        linear-gradient(to bottom, rgba(15, 23, 42, 0.6), rgba(10, 13, 18, 0.9));
    }

    .auth-container {
      background: var(--card-bg);
      padding: 32px 28px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 230, 118, 0.05);
      position: relative;
    }

    /* Project Main Title - Set to Green */
    .project-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--accent-green);
      text-align: center;
      letter-spacing: 1px;
      margin: 0 0 6px 0;
      text-transform: uppercase;
      line-height: 1.3;
    }

    .project-subtitle {
      text-align: center;
      color: var(--accent-green);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 22px;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 12px;
    }

    /* Login Subtitle */
    .login-heading {
      color: #FFFFFF;
      font-size: 1.1rem;
      text-align: center;
      margin: 0 0 4px 0;
      font-weight: 700;
    }

    p.subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.82rem;
      margin-top: 0;
      margin-bottom: 20px;
    }
    
    /* QR Code Section Styling */
    .qr-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 22px;
      padding: 14px;
      background: #0F172A;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .qr-container {
      background: #FFFFFF;
      padding: 8px;
      border-radius: 6px;
      display: inline-block;
    }

    .qr-label {
      margin-top: 8px;
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: monospace;
      letter-spacing: 0.5px;
    }

    .form-group { margin-bottom: 16px; }
    
    label { 
      display: block; 
      margin-bottom: 6px; 
      font-size: 0.8rem; 
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: #0B0F17;
      color: var(--text-main);
      box-sizing: border-box;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--accent-green);
      box-shadow: 0 0 8px rgba(0, 230, 118, 0.2);
    }

    button.main-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent-green);
      color: #000000;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    button.main-btn:hover { background: #00C853; }

    .toggle-btn {
      background: none;
      color: var(--accent-blue);
      border: none;
      margin-top: 16px;
      text-decoration: none;
      cursor: pointer;
      font-size: 0.82rem;
      width: 100%;
      text-align: center;
      transition: color 0.2s;
    }

    .toggle-btn:hover {
      text-decoration: underline;
      color: #80D8FF;
    }

    .alert-msg {
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 0.82rem;
      display: none;
      text-align: center;
    }

    .error { background: #3A0007; color: #FF1744; border: 1px solid #FF1744; }
    .success { background: #00270F; color: #00E676; border: 1px solid #00E676; }
  </style>
</head>
<body>

  <div class="auth-container">
    <!-- Main Project Header Title (Green) -->
    <h1 class="project-title">IoT BASED SPECTRUM ANALYZER</h1>
    <div class="project-subtitle">FOR 4G / LTE NETWORK</div>

    <!-- Login Mode Header -->
    <h2 class="login-heading" id="formTitle">Operator Login</h2>
    

    <!-- Scanner QR Access Code -->
    <div class="qr-section">
      <div id="qrcode" class="qr-container"></div>
      <span class="qr-label">SCAN TO LOGIN</span>
    </div>

    <div id="alertBox" class="alert-msg"></div>

    <!-- Authentication Form -->
    <form id="authForm">
      <div class="form-group">
        <label for="email">Operator Email</label>
        <input type="email" id="email" value="michaelamosy7@gmail.com" placeholder="operator@example.com" required>
      </div>

      <div class="form-group">
        <label for="password">Security Password</label>
        <input type="password" id="password" value="12345678" placeholder="••••••••" required>
      </div>

      <button type="submit" class="main-btn" id="submitBtn">Sign In as Default Operator</button>
    </form>

    <button type="button" class="toggle-btn" id="toggleBtn" onclick="toggleMode()">Need an operator account? Register</button>
  </div>

<script>
  // Render Dynamic URL QR Code
  new QRCode(document.getElementById("qrcode"), {
    text: window.location.href,
    width: 110,
    height: 110,
    colorDark : "#0A0D12",
    colorLight : "#FFFFFF",
    correctLevel : QRCode.CorrectLevel.H
  });

  // Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyDSJ7AJhy9zrOB0zsgmRAGebq5o7b0Xpb8",
    authDomain: "glte-lora-monitor-analyzer.firebaseapp.com",
    databaseURL: "https://glte-lora-monitor-analyzer-default-rtdb.firebaseio.com",
    projectId: "glte-lora-monitor-analyzer",
    storageBucket: "glte-lora-monitor-analyzer.firebasestorage.app",
    messagingSenderId: "370930551415",
    appId: "1:370930551415:web:2286579d85a48331311472",
    measurementId: "G-KWBNPTJYW6"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  var isSignUpMode = false;

  function toggleMode() {
    isSignUpMode = !isSignUpMode;
    var formTitle = document.getElementById('formTitle');
    var submitBtn = document.getElementById('submitBtn');
    var toggleBtn = document.getElementById('toggleBtn');
    var alertBox  = document.getElementById('alertBox');

    alertBox.style.display = 'none';

    if (isSignUpMode) {
      formTitle.innerText = "Register Account";
      submitBtn.innerText = "Create Operator Account";
      toggleBtn.innerText = "Already registered? Return to Login";
    } else {
      formTitle.innerText = "Operator Login";
      submitBtn.innerText = "Sign In as Default Operator";
      toggleBtn.innerText = "Need an operator account? Register";
    }
  }

  function showAlert(msg, type) {
    var alertBox = document.getElementById('alertBox');
    alertBox.innerText = msg;
    alertBox.className = "alert-msg " + type;
    alertBox.style.display = "block";
  }

  // Handle Form Submission
  document.getElementById('authForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var email = document.getElementById('email').value;
    var password = document.getElementById('password').value;

    document.getElementById('alertBox').style.display = 'none';

    if (isSignUpMode) {
      auth.createUserWithEmailAndPassword(email, password)
        .then(() => {
          window.location.href = "dashboard.html";
        })
        .catch((error) => {
          showAlert("Registration Failed: " + error.message, "error");
        });
    } else {
      auth.signInWithEmailAndPassword(email, password)
        .then(() => {
          window.location.href = "dashboard.html";
        })
        .catch((error) => {
          var errStr = JSON.stringify(error);
          if (
            error.code === 'auth/user-not-found' || 
            error.code === 'auth/invalid-login-credentials' ||
            errStr.includes('INVALID_LOGIN_CREDENTIALS')
          ) {
            auth.createUserWithEmailAndPassword(email, password)
              .then(() => {
                window.location.href = "dashboard.html";
              })
              .catch((regErr) => {
                showAlert("Account Setup Failed: " + regErr.message, "error");
              });
          } else {
            showAlert("Login Failed: " + error.message, "error");
          }
        });
    }
  });
</script>

</body>
</html>
