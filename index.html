<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LTE Monitor - Operator Login</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .auth-container {
      background: #1E1E1E;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid #333;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    h2 { color: #00E676; text-align: center; margin-top: 0; }
    p.subtitle { text-align: center; color: #888; font-size: 0.9rem; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #BBB; }
    input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2A2A2A;
      color: #FFF;
      box-sizing: border-box;
      font-size: 1rem;
    }
    input:focus { outline: none; border-color: #00E676; }
    button.main-btn {
      width: 100%;
      padding: 12px;
      background: #00E676;
      color: #000;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button.main-btn:hover { background: #00C853; }
    .toggle-btn {
      background: none;
      color: #2979FF;
      border: none;
      margin-top: 15px;
      text-decoration: underline;
      cursor: pointer;
      font-size: 0.9rem;
      width: 100%;
    }
    .alert-msg {
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 0.85rem;
      display: none;
      text-align: center;
    }
    .error { background: #3A0007; color: #FF1744; border: 1px solid #FF1744; }
    .success { background: #00270F; color: #00E676; border: 1px solid #00E676; }
  </style>
</head>
<body>

  <div class="auth-container">
    <h2 id="formTitle">Operator Login</h2>
    <p class="subtitle">LTE/LoRa Spectrum Monitor Portal</p>

    <div id="alertBox" class="alert-msg"></div>

    <form id="authForm">
      <div class="form-group">
        <label for="email">Operator Email</label>
        <input type="email" id="email" placeholder="operator@example.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="main-btn" id="submitBtn">Sign In</button>
    </form>

    <button type="button" class="toggle-btn" id="toggleBtn" onclick="toggleMode()">Need an account? Create One</button>
  </div>

<script>
  // Firebase Configuration
  const firebaseConfig = {
    databaseURL: "https://glte-lora-monitor-analyzer-default-rtdb.firebaseio.com/"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  var isSignUpMode = false;

  // Function called directly by button click
  function toggleMode() {
    isSignUpMode = !isSignUpMode;
    var formTitle = document.getElementById('formTitle');
    var submitBtn = document.getElementById('submitBtn');
    var toggleBtn = document.getElementById('toggleBtn');
    var alertBox  = document.getElementById('alertBox');

    alertBox.style.display = 'none';

    if (isSignUpMode) {
      formTitle.innerText = "Register Account";
      submitBtn.innerText = "Create Account & Send Verification";
      toggleBtn.innerText = "Already have an account? Login";
    } else {
      formTitle.innerText = "Operator Login";
      submitBtn.innerText = "Sign In";
      toggleBtn.innerText = "Need an account? Create One";
    }
  }

  function showAlert(msg, type) {
    var alertBox = document.getElementById('alertBox');
    alertBox.innerText = msg;
    alertBox.className = "alert-msg " + type;
    alertBox.style.display = "block";
  }

  // Check Auth status
  auth.onAuthStateChanged((user) => {
    if (user) {
      if (user.emailVerified) {
        window.location.href = "dashboard.html";
      } else {
        showAlert("Please check your email inbox to verify your account before logging in.", "error");
      }
    }
  });

  // Handle Form Submission
  document.getElementById('authForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var email = document.getElementById('email').value;
    var password = document.getElementById('password').value;

    document.getElementById('alertBox').style.display = 'none';

    if (isSignUpMode) {
      // Create Account & Send Verification Link
      auth.createUserWithEmailAndPassword(email, password)
        .then((userCredential) => {
          userCredential.user.sendEmailVerification().then(() => {
            showAlert("Account created! Verification link sent to your email. Please verify before logging in.", "success");
            auth.signOut();
            toggleMode();
          });
        })
        .catch((error) => {
          showAlert(error.message, "error");
        });
    } else {
      // Sign In User
      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          if (!userCredential.user.emailVerified) {
            showAlert("Email not verified yet! Please check your inbox.", "error");
            auth.signOut();
          } else {
            window.location.href = "dashboard.html";
          }
        })
        .catch((error) => {
          showAlert(error.message, "error");
        });
    }
  });
</script>

</body>
</html>
