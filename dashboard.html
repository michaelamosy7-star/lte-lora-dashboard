<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4G/LTE spectrum Monitor Dashboard</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #FFFFFF;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .top-bar {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .logout-btn {
      background: #FF1744;
      color: #FFF;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    h1 { color: #00E676; margin: 5px 0; text-align: center; }
    p.sub { color: #888; text-align: center; margin-bottom: 25px; }

    .status-card {
      width: 100%;
      max-width: 800px;
      padding: 15px;
      border-radius: 10px;
      border: 2px solid #00E676;
      background: #1E1E1E;
      text-align: center;
      font-size: 1.4rem;
      font-weight: bold;
      color: #00E676;
      margin-bottom: 25px;
      box-sizing: border-box;
    }

    .grid-container {
      width: 100%;
      max-width: 800px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .card {
      background: #1E1E1E;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
    }

    .card label {
      display: block;
      color: #888;
      font-size: 0.85rem;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .card .value {
      font-size: 1.6rem;
      font-weight: bold;
      color: #00E676;
    }

    .maps-btn {
      margin-top: 25px;
      background: #2979FF;
      color: #FFF;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .maps-btn:hover { background: #2962FF; }
  </style>
</head>
<body>

  <div class="top-bar">
    <span id="userEmail" style="color:#AAA;">Operator Loading...</span>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <h1>4G/LTE Monitor Dashboard</h1>
  <p class="sub">Real-Time Cloud Telemetry</p>

  <div class="status-card" id="statusCard">
    STATUS: CONNECTING TO CLOUD SERVER...
  </div>

  <div class="grid-container">
    <div class="card"><label>Band</label><div class="value" id="valBand">-</div></div>
    <div class="card"><label>RSSI</label><div class="value" id="valRssi">- dBm</div></div>
    <div class="card"><label>RSRP</label><div class="value" id="valRsrp">- dBm</div></div>
    <div class="card"><label>SINR</label><div class="value" id="valSinr">- dB</div></div>
    <div class="card"><label>Noise Floor</label><div class="value" id="valNf">- dBm</div></div>
    <div class="card"><label>Location</label><div class="value" id="valGps">0.0, 0.0</div></div>
  </div>

  <a id="mapsLink" href="#" target="_blank" class="maps-btn">view Possible jamming Location on Google Maps</a>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDSJ7AJhy9zrOB0zsgmRAGebq5o7b0Xpb8",
    authDomain: "glte-lora-monitor-analyzer.firebaseapp.com",
    databaseURL: "https://glte-lora-monitor-analyzer-default-rtdb.firebaseio.com",
    projectId: "glte-lora-monitor-analyzer",
    storageBucket: "glte-lora-monitor-analyzer.firebasestorage.app",
    messagingSenderId: "370930551415",
    appId: "1:370930551415:web:2286579d85a48331311472",
    measurementId: "G-KWBNPTJYW6"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  // Redirect if not logged in
  auth.onAuthStateChanged(user => {
    if (user) {
      document.getElementById('userEmail').innerText = "Operator: " + user.email;
      listenToTelemetry();
    } else {
      window.location.href = "index.html";
    }
  });

  function listenToTelemetry() {
    db.ref('/lte_monitor').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        document.getElementById('statusCard').innerText = "STATUS: " + (data.status || "NORMAL");
        
        // Change status color dynamically based on text
        if ((data.status || "").includes("INTERFERENCE")) {
          document.getElementById('statusCard').style.borderColor = "#FF1744";
          document.getElementById('statusCard').style.color = "#FF1744";
        } else if ((data.status || "").includes("OFFLINE")) {
          document.getElementById('statusCard').style.borderColor = "#FF9100";
          document.getElementById('statusCard').style.color = "#FF9100";
        } else {
          document.getElementById('statusCard').style.borderColor = "#00E676";
          document.getElementById('statusCard').style.color = "#00E676";
        }

        document.getElementById('valBand').innerText = data.band || "-";
        document.getElementById('valRssi').innerText = (data.rssi || "-") + " dBm";
        document.getElementById('valRsrp').innerText = (data.rsrp || "-") + " dBm";
        document.getElementById('valSinr').innerText = (data.sinr || "-") + " dB";
        document.getElementById('valNf').innerText = (data.nf || "-") + " dBm";
        
        const lat = data.lat || "0.000000";
        const lon = data.lon || "0.000000";
        document.getElementById('valGps').innerText = lat + ", " + lon;
        document.getElementById('mapsLink').href = `https://www.google.com/maps?q=${lat},${lon}`;
      }
    });
  }

  function logout() {
    auth.signOut().then(() => {
      window.location.href = "index.html";
    });
  }
</script>

</body>
</html>
