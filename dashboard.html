<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Global LTE LoRa Monitor Dashboard</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background-color: #121212; color: #FFFFFF; text-align: center; margin: 0; padding: 20px; }
    h1 { color: #00E676; margin-bottom: 5px; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; max-width: 800px; margin: 20px auto; }
    .card { background: #1E1E1E; padding: 15px; border-radius: 10px; border: 1px solid #333; }
    .card h3 { margin: 0; font-size: 0.9rem; color: #888; }
    .card p { margin: 10px 0 0; font-size: 1.4rem; font-weight: bold; color: #00E676; }
    .status-box { background: #1E1E1E; padding: 20px; border-radius: 10px; max-width: 800px; margin: 0 auto 20px; font-size: 1.3rem; font-weight: bold; }
    .status-normal { border: 2px solid #00E676; color: #00E676; }
    .status-interf { border: 2px solid #FF1744; color: #FF1744; background: #3A0007; }
    .status-offline { border: 2px solid #FF9100; color: #FF9100; }
    a.map-btn { display: inline-block; padding: 10px 20px; background: #2979FF; color: white; text-decoration: none; border-radius: 5px; margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>4G/LTE Monitor Dashboard</h1>
  <p>Real-Time Cloud Telemetry</p>

  <div id="statusCard" class="status-box status-normal">
    STATUS: <span id="statusVal">CONNECTING TO CLOUD...</span>
  </div>

  <div class="card-grid">
    <div class="card"><h3>BAND</h3><p id="bandVal">-</p></div>
    <div class="card"><h3>RSSI</h3><p id="rssiVal">- dB</p></div>
    <div class="card"><h3>RSRP</h3><p id="rsrpVal">- dB</p></div>
    <div class="card"><h3>SINR</h3><p id="sinrVal">- dB</p></div>
    <div class="card"><h3>NOISE FLOOR</h3><p id="nfVal">- dB</p></div>
    <div class="card"><h3>LOCATION</h3><p id="locVal">0.0, 0.0</p></div>
  </div>

  <a id="mapLink" class="map-btn" href="#" target="_blank">View Location on Google Maps</a>

<script>
  // Initialize Firebase Config with your custom RTDB URL
  const firebaseConfig = {
    databaseURL: "https://glte-lora-monitor-analyzer-default-rtdb.firebaseio.com/"
  };
  firebase.initializeApp(firebaseConfig);

  // Reference to real-time data node
  var dbRef = firebase.database().ref('lte_monitor');

  // Listen for live updates
  dbRef.on('value', (snapshot) => {
    var data = snapshot.val();
    if(data) {
      document.getElementById('bandVal').innerText = data.band || "-";
      document.getElementById('rssiVal').innerText = (data.rssi || "-") + " dB";
      document.getElementById('rsrpVal').innerText = (data.rsrp || "-") + " dB";
      document.getElementById('sinrVal').innerText = (data.sinr || "-") + " dB";
      document.getElementById('nfVal').innerText   = (data.nf || "-") + " dB";
      document.getElementById('locVal').innerText  = (data.lat || "0") + ", " + (data.lon || "0");
      document.getElementById('statusVal').innerText = data.status || "WAITING";

      document.getElementById('mapLink').href = `https://maps.google.com/?q=${data.lat},${data.lon}`;

      var sCard = document.getElementById('statusCard');
      sCard.className = "status-box ";
      if (data.status && data.status.includes("INTERFERENCE")) {
        sCard.classList.add("status-interf");
      } else if (data.status && data.status.includes("OFFLINE")) {
        sCard.classList.add("status-offline");
      } else {
        sCard.classList.add("status-normal");
      }
    }
  });
</script>
</body>
</html>
